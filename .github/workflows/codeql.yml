# CodeQL — free static security analysis for JS/TS (build-mode: none, no
# project build or install needed).
name: CodeQL

on:
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    # Dependabot PRs get a forced read-only GITHUB_TOKEN (GitHub policy),
    # which breaks CodeQL's API/cache access. Dependabot changes are still
    # scanned after merge via the push trigger on main/staging.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0 # codeql-bundle-v2.27.1
