# CI — runs on every PR and on pushes to main/staging.
# Required checks for branch protection (keep these job names identical in every
# repo so protection templates transfer): lint, typecheck, test, build, security.
name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Neon-dependent steps are skipped gracefully until the repo secrets exist,
  # so a freshly cloned template still gets green CI on first push.
  HAS_NEON: ${{ secrets.NEON_API_KEY != '' && secrets.NEON_PROJECT_ID != '' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --max-warnings=0
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client (tsc needs the generated types)
        run: pnpm exec prisma generate
      - run: pnpm typecheck

  # Applies all migrations to an ephemeral Neon branch (a real rehearsal of
  # every migration), checks the migrations match the schema, then runs the
  # unit tests with DATABASE_URL pointed at that branch.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compute branch name and expiry
        id: meta
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "branch=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "branch=ci-$RUN_ID" >> "$GITHUB_OUTPUT"
          fi
          # Self-delete orphaned branches after 2 days even if cleanup fails.
          echo "expires=$(date -u -d '+2 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Create Neon branch
        id: neon
        if: env.HAS_NEON == 'true'
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # 6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: ${{ steps.meta.outputs.branch }}
          # Direct (unpooled) URL — DDL/migrations must not go through PgBouncer.
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ steps.meta.outputs.expires }}
      - name: Apply migrations (rehearsal on throwaway branch)
        if: env.HAS_NEON == 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm exec prisma migrate deploy
      - name: Check migration drift (schema vs applied migrations)
        if: env.HAS_NEON == 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          if pnpm exec prisma migrate diff \
              --from-config-datasource \
              --to-schema prisma/schema.prisma \
              --exit-code; then
            echo "Migrations and schema are in sync."
          else
            echo "::error::Drift detected between prisma/schema.prisma and the applied migrations. Run 'pnpm exec prisma migrate dev --name <change>' locally and commit the generated migration."
            exit 1
          fi
      - name: Skip note (Neon not configured)
        if: env.HAS_NEON != 'true'
        run: echo '::warning::NEON_API_KEY / NEON_PROJECT_ID secrets not set — migration rehearsal and drift check skipped. See docs/CI.md to finish setup.'
      - name: Run unit tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Secret scanning (full git history), plus linting of the workflows themselves.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans full history
      - name: Run gitleaks (pinned binary — the official action requires a paid license for orgs)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          cd /tmp
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o gitleaks_checksums.txt
          grep "linux_x64.tar.gz" gitleaks_checksums.txt | shasum -a 256 --check -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git "${GITHUB_WORKSPACE}" --redact -v
      - name: Lint GitHub Actions workflows (actionlint + zizmor)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) latest /usr/local/bin
          pipx install zizmor
          actionlint
          zizmor .
