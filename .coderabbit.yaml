# CodeRabbit configuration — takes effect once CodeRabbit is installed on the
# GitHub org/repo (https://coderabbit.ai). Free for public repos; private
# repos require a paid plan. AI review is always a SECOND reviewer — keep
# branch protection requiring one human approval.
language: en
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - staging
chat:
  auto_reply: true
