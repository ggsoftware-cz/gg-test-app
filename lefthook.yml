# Installed automatically by `pnpm install` (prepare script).
# Docs: https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{js,jsx,ts,tsx,mjs,css,json,md,yaml,yml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{js,jsx,ts,tsx,mjs}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
